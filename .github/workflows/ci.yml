name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Installer les dépendances de développement
        run: python -m pip install -r requirements-dev.txt

      - name: Compilation du plugin
        run: python -m py_compile plugin.py

      - name: Lint (ruff)
        run: python -m ruff check plugin.py tests

      - name: Tests (pytest)
        run: python -m pytest -q
